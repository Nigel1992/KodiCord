name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: KodiCord version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: kodi
    attributes:
      label: Kodi version / platform
      placeholder: "e.g. Kodi 21 on LibreELEC 12.2"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Connection mode
      options:
        - Local Discord client
        - Remote bridge (PC)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant Kodi log snippets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
